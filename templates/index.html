<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css?v={{ static_version('static/css/style.css') }}">
    <title>toAVIF</title>
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>toAVIF</h1>
            <p class="subtitle">JPG · JPEG · PNG · WEBP · GIF 파일을 AVIF로 변환하세요. (최대 100개)</p>

            <form id="upload-form" class="upload-form">
                <label for="file-input" id="drop-zone" class="drop-zone">
                    <input id="file-input" name="files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.gif" hidden>
                    <div class="drop-content">
                        <strong>파일을 드래그 & 드롭</strong>
                        <span>또는 클릭해서 선택하세요.</span>
                    </div>
                </label>

                <div class="file-meta">
                    <p id="file-count">선택된 파일: 0개</p>
                    <button type="submit" id="convert-btn" disabled>AVIF로 변환</button>
                </div>
            </form>

            <p id="status" class="status"></p>
        </section>
    </main>

    <script src="/static/js/script.js?v={{ static_version('static/js/script.js') }}"></script>
</body>
</html>
